name: Build iOS IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2

      - name: Build Rust core
        run: cargo build --release --target aarch64-apple-ios

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build app (unsigned)
        run: |
          cd ios
          xcodebuild -project WiFiShare.xcodeproj -scheme WiFiShare \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/WiFiShare.app Payload/
          zip -qr WiFiShare.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: WiFiShare-ipa
          path: WiFiShare.ipa
